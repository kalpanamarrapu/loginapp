<meta charset="UTF-8">
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, #667eea, #764ba2);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            color: white;
            font-size: 20px;
        }

        .navbar button {
            background: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button.login-btn {
            width: 100%;
            padding: 10px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button.login-btn:hover {
            background: #5a3c8c;
        }

        #error {
            color: red;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div>🚀 My App</div>
    <button onclick="goToRegister()">Register</button>
</div>

<div class="container">
    <div class="card">
        <h2>Login</h2>

        <!-- 🔥 IMPORTANT: This connects to Spring Security -->
        <form method="post" action="/login">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>

            <button class="login-btn" type="submit">Login</button>
        </form>

        <p id="error"></p>
    </div>
</div>

<script>
function goToRegister() {
    window.location.href = "/register.html";
}

// show error if login fails
const params = new URLSearchParams(window.location.search);
if (params.get("error")) {
    document.getElementById("error").innerText = "Invalid credentials ❌";
}
</script>

</body>
</html>
