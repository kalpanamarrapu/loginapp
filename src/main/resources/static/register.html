<meta charset="UTF-8">
<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            color: white;
            font-size: 20px;
        }

        .navbar button {
            background: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button.register-btn {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button.register-btn:hover {
            background: #5a67d8;
        }

        #result {
            margin-top: 10px;
            color: green;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div>🚀 My App</div>
    <button onclick="goToLogin()">Login</button>
</div>

<div class="container">
    <div class="card">
        <h2>Create Account</h2>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">

        <button class="register-btn" onclick="register()">Register</button>

        <p id="result"></p>
    </div>
</div>

<script>
function register() {
    const user = {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
    };

    fetch("/api/register", {   // ✅ FIXED HERE
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(user)
    })
    .then(res => res.text())
    .then(data => {
        document.getElementById("result").innerText = data;
    })
    .catch(err => {
        document.getElementById("result").innerText = "Error: " + err;
    });
}

function goToLogin() {
    window.location.href = "/login.html";
}
</script>

</body>
</html>
